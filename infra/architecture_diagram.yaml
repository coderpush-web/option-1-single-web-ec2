Diagram:
  DefinitionFiles:
    - Type: URL
      Url: "https://raw.githubusercontent.com/awslabs/diagram-as-code/main/definitions/definition-for-aws-icons-light.yaml"

  Resources:
    Canvas:
      Type: AWS::Diagram::Canvas
      Direction: vertical
      Children:
        - AWSCloud
        - CloudFront
        - CloudflareEdge
        - User

    User:
      Type: AWS::Diagram::Resource
      Preset: User
      Title: "User"

    CloudflareEdge:
      Type: AWS::Diagram::Resource
      Preset: Internet
      Title: "Cloudflare Proxy (CDN/WAF)\nopt1.png261.dev"

    CloudFront:
      Type: AWS::Diagram::Resource
      Preset: "Amazon CloudFront"
      Title: "Amazon CloudFront\n(Static Cache & Edge)"

    AWSCloud:
      Type: AWS::Diagram::Cloud
      Direction: vertical
      Preset: AWSCloudNoLogo
      Align: center
      Children:
        - VPC

    VPC:
      Type: AWS::EC2::VPC
      Title: "VPC (10.0.0.0/16)"
      Direction: vertical
      Children:
        - PrivateSubnets
        - PublicSubnet
      BorderChildren:
        - Position: S
          Resource: IGW

    IGW:
      Type: AWS::EC2::InternetGateway
      IconFill:
        Type: rect

    PublicSubnet:
      Type: AWS::EC2::Subnet
      Preset: PublicSubnet
      Title: "Public Subnets (AZ1 & AZ2)"
      Children:
        - ALB
        - NATGW

    ALB:
      Type: AWS::ElasticLoadBalancingV2::LoadBalancer
      Preset: "Application Load Balancer"
      Title: "Application Load Balancer"

    NATGW:
      Type: AWS::EC2::NatGateway
      Title: "NAT Gateway (Egress)"

    PrivateSubnets:
      Type: AWS::EC2::Subnet
      Preset: PrivateSubnet
      Title: "Private Subnets (AZ1 & AZ2)"
      Children:
        - WebASG

    WebASG:
      Type: AWS::AutoScaling::AutoScalingGroup
      Preset: "AWS::AutoScaling::AutoScalingGroup"
      Title: "Web Auto Scaling Group\n(Docker on EC2)"

  Links:
    - Source: User
      SourcePosition: N
      Target: CloudflareEdge
      TargetPosition: S
      TargetArrowHead:
        Type: Open
      Type: orthogonal
      Labels:
        SourceLeft:
          Title: "HTTPS:443"
    - Source: CloudflareEdge
      SourcePosition: N
      Target: CloudFront
      TargetPosition: S
      TargetArrowHead:
        Type: Open
      Type: orthogonal
      Labels:
        SourceLeft:
          Title: "HTTPS:443"
    - Source: CloudFront
      SourcePosition: N
      Target: IGW
      TargetPosition: S
      TargetArrowHead:
        Type: Open
      Type: orthogonal
      Labels:
        SourceLeft:
          Title: "HTTP:80"
    - Source: IGW
      SourcePosition: N
      Target: ALB
      TargetPosition: S
      TargetArrowHead:
        Type: Open
      Type: orthogonal
    - Source: ALB
      SourcePosition: N
      Target: WebASG
      TargetPosition: S
      TargetArrowHead:
        Type: Open
      Type: orthogonal
      Labels:
        SourceLeft:
          Title: "HTTP:80"
    - Source: WebASG
      SourcePosition: E
      Target: NATGW
      TargetPosition: E
      TargetArrowHead:
        Type: Open
      Type: orthogonal
      Labels:
        SourceRight:
          Title: "Egress"
